name: Build

# Gemeinsame CI aller ESP32-Module (RC_Common 1.1.0):
#   1. Jede Kopie von src/RC_Common/ gegen MANIFEST.sha256 pruefen und die
#      Host-Tests (CRSF, Lua-Menue, LED, Einstellungen) ausfuehren.
#   2. Alle drei Sketches mit festem Core kompilieren und die Images
#      hochladen (*.ino.bin = OTA-Update, *.merged.bin = Komplett-Image).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  rc-common:
    name: RC_Common pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Kopien unveraendert (MANIFEST.sha256)
        run: |
          for d in MultiSwitch_ESP32 MultiSwitch_ESP32_V3 MultiSwitch_ESP32_TXRX; do
            (cd $d/src/RC_Common && sha256sum -c --quiet MANIFEST.sha256) || exit 1
          done
      - name: Host-Tests
        run: sh MultiSwitch_ESP32_V3/src/RC_Common/tests/run_tests.sh

  build:
    name: Build ${{ matrix.sketch }}
    needs: rc-common
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: [ MultiSwitch_ESP32, MultiSwitch_ESP32_V3, MultiSwitch_ESP32_TXRX ]
    steps:
      - uses: actions/checkout@v5

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install "Bolder Flight Systems SBUS@8.1.4" "TinyGPSPlus@1.0.3"

      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings default --output-dir build ${{ matrix.sketch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sketch }}
          path: build/*.bin
